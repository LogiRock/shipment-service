# ==========================================
# 1. CONEXIÓN AL CONFIG SERVER CENTRALIZADO
# ==========================================
spring.application.name=shipment-service
# El "optional:" permite que la app arranque usando los valores de respaldo si el servidor 8088 está apagado
spring.config.import=optional:configserver:http://localhost:8088

# ==========================================
# 2. CREDENCIALES DE RESPALDO (FALLBACK LOCAL)
# ==========================================
spring.datasource.url=jdbc:${DB_SUBPROTOCOL}://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# 3. CONFIGURACIONES INTERNAS (JPA / HIBERNATE)
# ==========================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# 4. INICIALIZACIÓN DE BASE DE DATOS
# ==========================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=false